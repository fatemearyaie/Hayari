services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "49327:8000"
    container_name: hayari-db

  redis:
    image: redis:7
    container_name: hayri-redis
    ports:
      - "6379:6379"

  hayari:
    build:
      context: .
      args:
        DJANGO_SETTINGS_MODULE: Hayari.settings.local
    volumes:
      - ./:/app
    container_name: hayari-django
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=Hayari.settings.local
      - RUN_MIGRATIONS=1
    depends_on:
      - db
      - redis
    command: python manage.py runserver 0.0.0.0:8000

  celery:
    build: .
    container_name: hayari-celery
    command: celery -A Hayari worker -l INFO --concurrency=4
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: Hayari.settings.local
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: hayari-celery-beat
    command: celery -A Hayari beat -l INFO
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: Hayari.settings.local
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data: