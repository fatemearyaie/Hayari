services:
  goldmold:
    build:
      context: .
      args:
        DJANGO_SETTINGS_MODULE: GoldMold.settings.production
    container_name: goldmold
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=GoldMold.settings.production
      - RUN_MIGRATIONS=1
    depends_on:
      - redis
    networks:
      - goldmold-network
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    command: >
      gunicorn GoldMold.asgi:application
          -k uvicorn.workers.UvicornWorker
          --workers 3
          --worker-connections 1000
          --bind 0.0.0.0:8000 
          --timeout 15
          --keep-alive 2
          --max-requests 1000
          --max-requests-jitter 100

  celery:
    build: .
    container_name: goldmold-celery
    command: celery -A GoldMold worker -l INFO --concurrency=4
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: GoldMold.settings.production
    volumes:
      - .:/app
    depends_on:
      - redis
    networks:
      - goldmold-network
    extra_hosts:
      - "host.docker.internal:172.17.0.1"

  celery-beat:
    build: .
    container_name: goldmold-celery-beat
    command: celery -A GoldMold beat -l INFO
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: GoldMold.settings.production
    volumes:
      - .:/app
    depends_on:
      - redis


  redis:
    image: redis:7.2-alpine
    container_name: goldmold-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - goldmold-network
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru

networks:
  goldmold-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-data:
